<nb-menu [items]="items"></nb-menu>
<div class="settings"></div>
<nb-accordion>
    <nb-accordion-item #item (collapsedChange)="settingSectionCollapseEventListener()">
        <nb-accordion-item-header [ngClass]="{
                accordionIconInvisible: ((sidebarState) !== 'expanded')
                }">
            <nb-icon icon="settings"></nb-icon>
            <span *ngIf="((sidebarState) === 'expanded')">Page Settings</span>
<!--            <span>Page Settings</span>-->
        </nb-accordion-item-header>
        <nb-accordion-item-body>
            <div class="themeChanger">
                <div class="subtitle">Theme</div>
                <app-theme-changer></app-theme-changer>
            </div>
            <app-view-settings></app-view-settings>
        </nb-accordion-item-body>
    </nb-accordion-item>
</nb-accordion>
