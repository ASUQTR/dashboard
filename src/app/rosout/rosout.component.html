<nb-chat title="Rosout" size="medium">
    <nb-chat-message
        *ngFor="let msg of messages"
        type="text"
        [message]="'['+rosoutLevel[msg.level]+'] ' +msg.msg"
        reply="false"
        [sender]="msg.name"
        [date]="msg.header.stamp.secs * 1000"
        dateFormat="longTime"
        avatar="../../assets/ros_logo.png"
    >
    </nb-chat-message>
</nb-chat>
