<span class="h5">Reposition</span>
<div class="repositionInputs">
    <input nbInput type="number" placeholder="x" [formControl]="repositionX">
    <input nbInput type="number" placeholder="y" [formControl]="repositionY">
    <input nbInput type="number" placeholder="z" [formControl]="repositionZ">
    <button nbButton status="primary" (click)="reposition()"><nb-icon icon="upload"></nb-icon></button>
</div>
