<ng-template #dialog let-data let-ref="dialogRef">
    <nb-card>
        <nb-card-body><app-gamepad forceShowLegend="true"></app-gamepad></nb-card-body>
        <nb-card-footer>
            <button nbButton status="danger" (click)="ref.close()">Close</button>
        </nb-card-footer>
    </nb-card>
</ng-template>

<button nbButton appearance="ghost" (click)="openGamepadBiggerInDialog(dialog)" nbTooltip="Click to enlarge penis" nbTooltipTrigger="hint" nbTooltipPlacement="left">
    <app-gamepad></app-gamepad>
</button>
