<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
		<link rel="stylesheet" href="style.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> 	
		
	</head>
   	<body>
		<header>
			<h1>ASUQTR</h1>				
		</header>

		<h3 id="feedback" style="background: #bdc3c7;"></h3>
		<h3 id="gamepadinfo" style="background: #ecf0f1;"> En attente du joystick...</h3>	

		//<h3> Cameras </h3>
		
		<div class="webcam_pannel"> 
			<div class="column">
              	<h3> Cameras POD1 </h3>
				<img src="http://192.168.2.106:8080/stream?topic=/detectnet/overlay" height="400" width="400" align="middle"/>
			</div>
		</div>

		<div id="container" style="width:100%;">                                   
			<div class="motor_pannel"> 
				<h3> Joy_Info </h3>
				<table id="motorTable" cellpadding="10" cellspacing="5">
					<tr>
						<td>Stick left X</td>
						<td>Stick left Y</td>	
						<td>Stick right X</td>	
						<td>Stick right Y</td>
						<td>Trigger left</td>
						<td>Trigger right</td>
					</tr>
					<tr>
						<td><progress id="axis_stick_left_LR" type="progress" value="0" min="0" max="100"></progress></td>
						<td><progress id="axis_stick_left_UD" type="progress" value="0" min="0" max="100"></progress></td>
						<td><progress id="axis_stick_right_LR" type="progress" value="0" min="0" max="100"></progress></td>
						<td><progress id="axis_stick_right_UD" type="progress" value="0" min="0" max="100"></progress></td>
						<td><progress id="axis_trigger_left" type="progress" value="0" min="0" max="100"></progress></td>
						<td><progress id="axis_trigger_right" type="progress" value="0" min="0" max="100"></progress></td>
					</tr>						
				</table>
			</div>
			
		</div> 
		
		<div> 
			<h3> LQR Error Info </h3>
			<p id="lqr_error"></p>
		</div> 
		<div> 
			<h3> Motor Throttles Info </h3>
			<p id="motor_throttles"></p>
		</div> 
		<div> 
			<h3> Rosout Info </h3>
			<p id="rosout"></p>
		</div>
		<div> 
			<h3> Control switch</h3>
			<p id="control_switch"></p>
		</div>
		<div> 
			<h3> Depth Info </h3>
			<p id="depthDiv"></p>
		</div>
		<canvas id="t1" width="520" height="520"></canvas>
		<canvas id="t2" width="520" height="520"></canvas>
		<canvas id="t3" width="440" height="439"></canvas>
		<canvas id="t4" width="440" height="439"></canvas>
		<canvas id="t5" width="440" height="439"></canvas>
		<canvas id="t6" width="440" height="439"></canvas>
		<canvas id="t7" width="520" height="520"></canvas>
		<canvas id="t8" width="520" height="520"></canvas>
		<script type="text/javascript" src="auv_canvas.js"></script>
		<script type="text/javascript" src="roslib.js"></script>
		<script type="text/javascript" src="ros_functions.js"></script>	
		<script type="text/javascript" src="ros_subscribers.js"></script>
	</body>
</html>
